<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Piste A · Liquid Chrome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes lc-sheen{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes lc-hue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes lc-float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-14px,18px) scale(1.08)}}
@keyframes lc-float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-12px) scale(0.94)}}
@keyframes lc-spin{to{transform:rotate(360deg)}}
@keyframes lc-pulse{0%,100%{opacity:.25;transform:scale(.8)}12%{opacity:1;transform:scale(1.15)}}
@keyframes lc-wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.lc-chrome{background:linear-gradient(100deg,#5d6068 0%,#f5f7fb 18%,#8b8f99 30%,#ffffff 42%,#4a4d55 55%,#e8ebf2 70%,#7d818b 85%,#fdfdff 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lc-sheen 4s linear infinite}
.lc-holo{background:conic-gradient(from 0deg,#ff9ad5,#9ad0ff,#b8ffd9,#fff3a1,#d4a8ff,#ff9ad5);animation:lc-hue 6s linear infinite}
.lc-blob{position:absolute;border-radius:50%;filter:blur(36px);opacity:.55}
.lc-key{transition:transform .15s ease, box-shadow .15s ease}
.lc-key:hover{transform:translateY(-2px)}
.lc-bars span{display:block;width:3px;border-radius:2px;background:linear-gradient(#fff,#8d93a0);transform-origin:bottom;animation:lc-wave 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.lc-chrome,.lc-holo,.lc-blob,.lc-bars span,.lc-spin{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#050507;font-family:'Space Mono',ui-monospace,monospace;color:#e9ebf0">
  <div class="lc-blob lc-holo" style="width:260px;height:260px;left:-80px;top:-60px;animation:lc-hue 6s linear infinite, lc-float 9s ease-in-out infinite"></div>
  <div class="lc-blob lc-holo" style="width:220px;height:220px;right:-90px;top:330px;animation:lc-hue 8s linear infinite reverse, lc-float2 11s ease-in-out infinite"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,0.06),transparent 60%)"></div>

  <div style="position:relative;display:flex;flex-direction:column;gap:18px;padding:58px 22px 0">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:12px">
        <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true" class="lc-spin" style="animation:lc-spin 18s linear infinite">
          <defs>
            <linearGradient id="lcA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#7c818c"/><stop offset=".55" stop-color="#f4f6fb"/><stop offset=".8" stop-color="#3c3f46"/><stop offset="1" stop-color="#d9dde6"/></linearGradient>
            <linearGradient id="lcH" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff9ad5" stop-opacity=".7"/><stop offset=".5" stop-color="#9ad0ff" stop-opacity=".2"/><stop offset="1" stop-color="#b8ffd9" stop-opacity=".7"/></linearGradient>
          </defs>
          <path d="M32 2 C35 22 42 29 62 32 C42 35 35 42 32 62 C29 42 22 35 2 32 C22 29 29 22 32 2Z" fill="url(#lcA)"/>
          <path d="M32 2 C35 22 42 29 62 32 C42 35 35 42 32 62 C29 42 22 35 2 32 C22 29 29 22 32 2Z" fill="url(#lcH)"/>
          <circle cx="32" cy="32" r="9" fill="#050507"/>
          <circle cx="32" cy="32" r="9" fill="none" stroke="url(#lcA)" stroke-width="2.5"/>
        </svg>
        <div style="display:flex;flex-direction:column">
          <span class="lc-chrome" style="font-family:Unbounded,sans-serif;font-weight:900;font-size:19px;letter-spacing:.02em;line-height:1">REEL'S</span>
          <span style="font-family:Unbounded,sans-serif;font-weight:400;font-size:10px;letter-spacing:.42em;color:#8d93a0">TOOLS</span>
        </div>
      </div>
      <button type="button" aria-label="Réglages" style="width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04);color:#e9ebf0;display:grid;place-items:center">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M4 12h3m10 0h3M12 4v3m0 10v3"/></svg>
      </button>
    </div>

    <div style="position:relative;border-radius:28px;padding:22px 22px 18px;background:linear-gradient(160deg,rgba(255,255,255,0.10),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.16);box-shadow:inset 0 1px 0 rgba(255,255,255,0.25),0 30px 60px rgba(0,0,0,0.6);overflow:hidden">
      <div class="lc-holo" style="position:absolute;inset:-40%;opacity:.12;mix-blend-mode:screen;animation:lc-hue 7s linear infinite, lc-spin 20s linear infinite"></div>
      <div style="position:relative;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:10px;letter-spacing:.3em;color:#8d93a0">TEMPO · BPM</span>
        <div style="display:flex;gap:6px">
          <span style="width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px #9ad0ff;animation:lc-pulse .857s linear infinite"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px #ff9ad5;animation:lc-pulse .857s linear infinite;animation-delay:.428s"></span>
        </div>
      </div>
      <div class="lc-chrome" style="position:relative;font-family:Unbounded,sans-serif;font-weight:900;font-size:120px;line-height:1;letter-spacing:-.04em;margin-top:6px">{{bpm}}</div>
      <div class="lc-bars" style="position:relative;display:flex;align-items:flex-end;gap:4px;height:28px;margin-top:10px">
        <span style="height:100%;animation-delay:0s"></span><span style="height:100%;animation-delay:.1s"></span><span style="height:100%;animation-delay:.2s"></span><span style="height:100%;animation-delay:.3s"></span><span style="height:100%;animation-delay:.15s"></span><span style="height:100%;animation-delay:.05s"></span><span style="height:100%;animation-delay:.25s"></span><span style="height:100%;animation-delay:.35s"></span><span style="height:100%;animation-delay:.12s"></span><span style="height:100%;animation-delay:.22s"></span><span style="height:100%;animation-delay:.08s"></span><span style="height:100%;animation-delay:.3s"></span><span style="height:100%;animation-delay:.18s"></span><span style="height:100%;animation-delay:.02s"></span><span style="height:100%;animation-delay:.27s"></span><span style="height:100%;animation-delay:.14s"></span>
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
        <button type="button" class="lc-key" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <div style="border-radius:18px;padding:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1)"><div style="font-size:9px;letter-spacing:.25em;color:#8d93a0">1/4</div><div style="font-weight:700;font-size:18px;margin-top:4px">{{q}}</div><div style="font-size:10px;color:#8d93a0">ms</div></div>
      <div style="border-radius:18px;padding:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1)"><div style="font-size:9px;letter-spacing:.25em;color:#8d93a0">1/8 ·</div><div style="font-weight:700;font-size:18px;margin-top:4px">{{e}}</div><div style="font-size:10px;color:#8d93a0">ms</div></div>
      <div style="border-radius:18px;padding:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1)"><div style="font-size:9px;letter-spacing:.25em;color:#8d93a0">1/16 T</div><div style="font-weight:700;font-size:18px;margin-top:4px">{{s}}</div><div style="font-size:10px;color:#8d93a0">ms</div></div>
    </div>

    <div style="border-radius:22px;padding:16px 18px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:9px;letter-spacing:.25em;color:#8d93a0">REVERB · DECAY 1 MESURE</div><div style="font-weight:700;font-size:22px;margin-top:4px">{{rv}} <span style="font-size:11px;color:#8d93a0">ms</span></div></div>
      <div class="lc-holo" style="width:44px;height:44px;border-radius:50%;opacity:.9;box-shadow:0 0 30px rgba(154,208,255,0.35)"></div>
    </div>
  </div>

  <nav aria-label="Outils" style="position:absolute;left:14px;right:14px;bottom:24px;height:68px;border-radius:34px;background:rgba(20,21,26,0.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.14);box-shadow:inset 0 1px 0 rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:space-around">
    <a href="#" style="text-decoration:none;color:#050507;font-family:Unbounded,sans-serif;font-weight:700;font-size:10px;letter-spacing:.12em;padding:12px 16px;border-radius:24px;background:linear-gradient(100deg,#c8ccd5,#ffffff,#9da2ad)">TEMPO</a>
    <a href="#" style="text-decoration:none;color:#8d93a0;font-family:Unbounded,sans-serif;font-size:10px;letter-spacing:.12em">TAP</a>
    <a href="#" style="text-decoration:none;color:#8d93a0;font-family:Unbounded,sans-serif;font-size:10px;letter-spacing:.12em">GAMMES</a>
    <a href="#" style="text-decoration:none;color:#8d93a0;font-family:Unbounded,sans-serif;font-size:10px;letter-spacing:.12em">SPLITS</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { bpm: 140 }; }
  renderVals() {
    var bpm = this.state.bpm, beat = 60000 / bpm;
    var f = function (x) { return x.toFixed(1).replace('.', ','); };
    var self = this;
    var presets = [70, 90, 120, 140, 160].map(function (b) {
      var on = b === bpm;
      return {
        label: String(b),
        pick: function () { self.setState({ bpm: b }); },
        style: 'min-width:52px;height:44px;border-radius:22px;font-family:Space Mono,monospace;font-weight:700;font-size:13px;cursor:pointer;' +
          (on ? 'color:#050507;border:0;background:linear-gradient(100deg,#9da2ad,#ffffff 40%,#c8ccd5 60%,#ffffff);box-shadow:0 0 24px rgba(255,255,255,0.25)'
              : 'color:#e9ebf0;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.04)')
      };
    });
    return { bpm: String(bpm), presets: presets, q: f(beat), e: f(beat * 0.75), s: f(beat / 4 * 2 / 3), rv: f(beat * 4 - beat / 8) };
  }
}
</script>
</body>
</html>
