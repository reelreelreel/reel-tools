function worldPoint(obj, local) { return obj.localToWorld(local.clone()); }
function worldNormal(obj, local) { return local.clone().applyQuaternion(obj.getWorldQuaternion(new THREE.Quaternion())).normalize(); }
function fitDist(halfW, halfH) { const v = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2); return Math.max(halfH / v, halfW / (v * camera.aspect)); }
function shotPose(name) {
  const up = new THREE.Vector3(0, 1, 0);
  const viaNormal = (obj, local, n, hw, hh, m = 1.12) => { const c = worldPoint(obj, local); const nn = worldNormal(obj, n); return { pos: c.clone().add(nn.multiplyScalar(fitDist(hw * m, hh * m))), look: c }; };
  switch (name) {
    case "overview": { const t = layoutMode === "tall"; const look = new THREE.Vector3(t ? 0 : -.05, t ? .34 : .45, t ? -.1 : -.25); const dir = new THREE.Vector3(-.3, t ? .42 : .3, 1).normalize(); const d = fitDist(t ? 1.12 : 1.75, t ? .7 : .95) * 1.08; return { pos: look.clone().add(dir.multiplyScalar(d)), look }; }
    case "tempo": return viaNormal(tempo, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 1), RW / 2, .06);
    case "loudness": return viaNormal(loud, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 1), RW / 2, .06);
    case "scope": return viaNormal(scope, new THREE.Vector3(0, .045, 0), new THREE.Vector3(0, 1, .3), .14, .17);
    case "synth": return viaNormal(synth, new THREE.Vector3(0, .06, 0), new THREE.Vector3(0, 1, .55), .4, .2);
    case "modular": return viaNormal(modular, new THREE.Vector3(0, .03, 0), new THREE.Vector3(0, 1, .25), .2, .13);
    case "tt": return viaNormal(tt, new THREE.Vector3(0, .06, 0), new THREE.Vector3(0, 1, .3), .25, .2);
    case "tape": return viaNormal(tape, new THREE.Vector3(0, .07, 0), new THREE.Vector3(0, 1, .3), .23, .18);
    case "book": return viaNormal(book, new THREE.Vector3(0, .014, 0), new THREE.Vector3(0, 1, .2), .1, .14);
  }
}

const bokeh = new BokehPass(scene, camera, { focus: 1, aperture: .01, maxblur: .008 }); composer.addPass(bokeh);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(512, 512), .45, .35, .985));
composer.addPass(new OutputPass());
function layout() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h; camera.fov = camera.aspect < .85 ? 44 : 34; camera.updateProjectionMatrix();
  place();
  // lamp from the top-left, slightly behind
  lamp.position.copy(worldPoint(lampG, new THREE.Vector3(0, .44, .36))); lamp.target.position.set(-.45, 0, .2);
  cold.position.set(-.4, 1.1, -1.2); cold.target.position.set(0, 0, .3);
  glowAmber.position.copy(worldPoint(loud, new THREE.Vector3(0, 0, .12)));
}
addEventListener("resize", layout); layout();
{ const p = shotPose(current); cam.pos.copy(p.pos); cam.look.copy(p.look); }

// ================= interaction =================
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const pointer = { x: 0, y: 0 }, par = { x: 0, y: 0 };
let drag = null, swipe = null, taps = [], tapPress = 0, flash = 0, hintOn = true;
function pick(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); const h = ray.intersectObjects(clickables, false)[0]; return h ? h.object.userData.action : null; }
function hideHint() { if (hintOn) { hintOn = false; $("hint").classList.add("off"); } }
function go(n) { current = n; store.set("shot2", n); hideHint(); }
function setBpm(v) { bpm = Math.min(300, Math.max(30, Math.round(v * 10) / 10)); store.set("bpm", bpm); drawLed(); drawVfd(); }
function setNote(i) { noteIx = (i + NOTES.length) % NOTES.length; store.set("note", noteIx); drawVfd(); }
function message(a, b, ms = 1100) { vfdMsg = [a, b]; vfdMsgT = performance.now() + ms; drawVfd(); }
function tap() { const now = performance.now(); if (taps.length && now - taps[taps.length - 1] > 2000) taps = []; taps.push(now); if (taps.length > 10) taps.shift(); tapPress = 1; flash = 1; if (taps.length >= 3) setBpm(60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1))); else message("TAP...", "  keep tapping"); }
const controlActions = ["tempo", "note", "tap", "half", "double", "copy"];
stage.addEventListener("pointerdown", (e) => { const a = pick(e); swipe = { x: e.clientX, y: e.clientY, t: performance.now(), a }; if (current === "tempo" && a === "tempo") { drag = { y: e.clientY, x: e.clientX, start: bpm }; stage.setPointerCapture(e.pointerId); } });
stage.addEventListener("pointermove", (e) => { pointer.x = e.clientX / innerWidth - .5; pointer.y = e.clientY / innerHeight - .5; if (drag) { setBpm(drag.start + ((drag.y - e.clientY) + (e.clientX - drag.x)) * .2); return; } stage.style.cursor = pick(e) ? "pointer" : "default"; });
stage.addEventListener("pointerup", (e) => {
  const wasDrag = !!drag; drag = null; if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y, dt = performance.now() - swipe.t, a = swipe.a; swipe = null;
  if (wasDrag) return;
  const big = Math.max(Math.abs(dx), Math.abs(dy));
  if (big > 50 && dt < 700) { const i = order.indexOf(current); const dir = (Math.abs(dy) > Math.abs(dx) ? -dy : -dx) > 0 ? 1 : -1; go(order[Math.min(order.length - 1, Math.max(0, i + dir))]); return; }
  if (big > 12) return;
  if (current === "tempo" && controlActions.includes(a)) {
    if (a === "tap") return tap(); if (a === "note") return setNote(noteIx + 1);
    if (a === "half") { setBpm(bpm / 2); return message("TEMPO ÷ 2", ""); } if (a === "double") { setBpm(bpm * 2); return message("TEMPO × 2", ""); }
    if (a === "copy") { const beat = 60000 / bpm, [, mul] = NOTES[noteIx]; const ms = (mul < 0 ? beat * -mul - beat / 8 : beat * mul).toFixed(1).replace(".", ","); (navigator.clipboard ? navigator.clipboard.writeText(ms) : Promise.reject()).then(() => message("COPIED", "  " + ms + " ms"), () => message("COPY FAILED", "")); return; }
    return;
  }
  if (controlActions.includes(a)) return go("tempo");
  if (a && a.startsWith("m:")) {
    let m = a.slice(2);
    if (m === "tempo") { // the rack holds two machines: pick by which unit was hit
      ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
      const h = ray.intersectObjects([tempo, loud], true)[0]; let o = h?.object; while (o && o !== tempo && o !== loud) o = o.parent; m = o === loud ? "loudness" : "tempo";
    }
    if (current !== m) return go(m);
    return;
  }
  if (!a && current !== "overview") go("overview");
});
stage.addEventListener("pointercancel", () => { drag = null; swipe = null; });
stage.addEventListener("wheel", (e) => { if (current === "tempo" && pick(e) === "tempo") { e.preventDefault(); setBpm(bpm - Math.sign(e.deltaY) * (e.shiftKey ? .1 : 1)); } }, { passive: false });
addEventListener("keydown", (e) => {
  const i = order.indexOf(current);
  if (e.key === "Escape") go("overview");
  if (e.key === "PageDown" || e.key === "ArrowRight" && current !== "tempo") go(order[Math.min(order.length - 1, i + 1)]);
  if (e.key === "PageUp" || e.key === "ArrowLeft" && current !== "tempo") go(order[Math.max(0, i - 1)]);
  if (current !== "tempo") return;
  if (e.code === "Space") { e.preventDefault(); tap(); }
  if (e.key === "ArrowUp") setBpm(bpm + (e.shiftKey ? .1 : 1)); if (e.key === "ArrowDown") setBpm(bpm - (e.shiftKey ? .1 : 1));
  if (e.key === "n") setNote(noteIx + 1);
});
drawLed(); drawVfd(); drawScope(0); drawOsc(0);
$("boot").classList.add("off"); setTimeout(hideHint, 7000);

// ================= loop =================
const clock = new THREE.Clock(); const tmp = new THREE.Vector3(); let lastScope = 0;
const UP_Y = new THREE.Vector3(0, 1, 0); const camUp = UP_Y.clone();
function frame() {
  const t = clock.getElapsedTime();
  const target = shotPose(current); const k = reduced ? 1 : .06;
  cam.pos.lerp(target.pos, k); cam.look.lerp(target.look, k);
  par.x += (pointer.x - par.x) * .05; par.y += (pointer.y - par.y) * .05;
  const amp = current === "overview" ? .05 : .015, dr = reduced ? 0 : 1;
  camera.position.copy(cam.pos).add(tmp.set(par.x * amp + Math.sin(t * .31) * .006 * dr, -par.y * amp * .5 + Math.sin(t * .23) * .004 * dr, 0));
  camera.up.copy(UP_Y);
  camera.lookAt(cam.look);
  bokeh.uniforms.focus.value = camera.position.distanceTo(cam.look);
  bokeh.uniforms.aperture.value = current === "overview" ? .009 : .016;
  const beatLen = 60 / bpm, ph = (t % beatLen) / beatLen, pulse = reduced ? .4 : Math.exp(-ph * 8);
  jewel.material.emissiveIntensity = .15 + pulse * 5; tapLed.material.emissiveIntensity = .15 + flash * 6 + pulse * .4;
  enc.userData.spin.rotation.y += ((-(bpm - 30) / 270 * Math.PI * 1.66) - enc.userData.spin.rotation.y) * .25;
  sel.rotation.y += ((-(-150 + noteIx * (300 / (NOTES.length - 1))) * Math.PI / 180) - sel.rotation.y) * .3;
  tapPress *= .8; flash *= .86; tapBtn.position.z = .005 - tapPress * .003; if (flash > .04) drawLed(flash > .5);
  if (vfdMsg && performance.now() > vfdMsgT) { vfdMsg = null; drawVfd(); }
  if (!reduced) {
    vuNeedles.forEach((n, i) => { const g = -.62 + pulse * .75 + Math.sin(t * (2 + i)) * .06; n.rotation.z += (-g - n.rotation.z) * .2; });
    platter.rotation.y -= .0349 * 1.0; // ~33 rpm visual
    reels.forEach((r) => (r.rotation.y -= .02));
    recLed.material.emissiveIntensity = Math.sin(t * 3) > 0 ? 2 : .2;
    if (t - lastScope > 1 / 30) { lastScope = t; drawScope(t); drawTV(t); }
    if (Math.floor(t / 2) !== Math.floor((t - .016) / 2)) drawOsc(t);
  }
  composer.render(); requestAnimationFrame(frame);
}
frame();
