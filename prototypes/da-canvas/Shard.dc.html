<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Piste C · Holo Shard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Chakra+Petch:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes hs-foil{0%{background-position:0% 50%}100%{background-position:400% 50%}}
@keyframes hs-glint{0%{transform:translateX(-140%) skewX(-20deg)}60%,100%{transform:translateX(260%) skewX(-20deg)}}
@keyframes hs-rot{to{transform:rotate(360deg)}}
@keyframes hs-flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.3}94%{opacity:1}96%{opacity:.5}97%{opacity:1}}
@keyframes hs-drift{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-8px) rotate(var(--r))}}
@keyframes hs-tick{0%,100%{transform:scaleX(.15)}50%{transform:scaleX(1)}}
.hs-foil{background:linear-gradient(90deg,#c7c9ff,#ffd1f0,#fff6c9,#c9fff1,#c7d8ff,#e6c9ff,#c7c9ff);background-size:400% 100%;animation:hs-foil 6s linear infinite}
.hs-chrome{background:linear-gradient(170deg,#ffffff 0%,#b8bcc6 30%,#3c3f46 48%,#ffffff 52%,#9ea3ad 75%,#ffffff 100%)}
.hs-text-chrome{background:linear-gradient(175deg,#ffffff 0%,#d2d6de 38%,#45484f 50%,#f6f7fa 56%,#9ea3ad 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hs-text-foil{background:linear-gradient(90deg,#c7c9ff,#ffd1f0,#fff6c9,#c9fff1,#c7d8ff,#e6c9ff,#c7c9ff);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hs-foil 5s linear infinite}
.hs-glint{position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.55),transparent);animation:hs-glint 3.5s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.hs-foil,.hs-text-foil,.hs-glint,[style*="animation"]{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:radial-gradient(90% 60% at 80% 10%,#1b1c24 0%,#060608 60%);color:#e9ebf0;font-family:'Chakra Petch',sans-serif">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position:absolute;inset:0;opacity:.5">
    <defs><linearGradient id="hsL" x1="0" x2="1"><stop offset="0" stop-color="#c7c9ff" stop-opacity="0"/><stop offset=".5" stop-color="#ffd1f0" stop-opacity=".5"/><stop offset="1" stop-color="#c9fff1" stop-opacity="0"/></linearGradient></defs>
    <path d="M-20 300 L410 180" stroke="url(#hsL)" stroke-width="1"/><path d="M-20 520 L410 640" stroke="url(#hsL)" stroke-width="1"/><path d="M60 -10 L250 860" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </svg>
  <div class="hs-foil" style="position:absolute;width:300px;height:300px;right:-140px;top:-120px;clip-path:polygon(50% 0,100% 40%,70% 100%,0 70%);opacity:.18;filter:blur(2px);animation:hs-foil 6s linear infinite, hs-rot 40s linear infinite"></div>

  <div style="position:relative;display:flex;flex-direction:column;gap:16px;padding:56px 20px 0">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="position:relative;width:52px;height:52px">
        <svg width="52" height="52" viewBox="0 0 64 64" aria-hidden="true" style="animation:hs-rot 24s linear infinite">
          <defs>
            <linearGradient id="hsC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#9ea3ad"/><stop offset=".5" stop-color="#2f3238"/><stop offset=".56" stop-color="#f4f6fa"/><stop offset="1" stop-color="#8d929c"/></linearGradient>
            <linearGradient id="hsF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7c9ff"/><stop offset=".33" stop-color="#ffd1f0"/><stop offset=".66" stop-color="#fff6c9"/><stop offset="1" stop-color="#c9fff1"/></linearGradient>
          </defs>
          <polygon points="32,1 40,24 63,32 40,40 32,63 24,40 1,32 24,24" fill="url(#hsC)"/>
          <polygon points="32,10 37,27 54,32 37,37 32,54 27,37 10,32 27,27" fill="url(#hsF)" opacity=".85"/>
          <polygon points="32,20 35,29 44,32 35,35 32,44 29,35 20,32 29,29" fill="#060608"/>
        </svg>
      </div>
      <div style="flex:1">
        <div class="hs-text-chrome" style="font-family:Michroma,sans-serif;font-size:21px;letter-spacing:.06em;line-height:1">REEL'S TOOLS</div>
        <div style="font-size:10px;letter-spacing:.4em;color:#8d93a0;margin-top:6px">STUDIO UTILITY // 001</div>
      </div>
    </div>

    <div style="position:relative;--r:-1.5deg;transform:rotate(-1.5deg);animation:hs-drift 6s ease-in-out infinite">
      <div class="hs-chrome" style="position:absolute;inset:-1px;clip-path:polygon(0 14px,14px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)"></div>
      <div style="position:relative;margin:1px;padding:18px 18px 14px;background:linear-gradient(160deg,#121318,#08080b);clip-path:polygon(0 14px,14px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%);overflow:hidden">
        <div class="hs-glint"></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;letter-spacing:.3em;color:#8d93a0"><span>TEMPO</span><span style="animation:hs-flick 4s linear infinite">◆ SYNC</span></div>
        <div style="display:flex;align-items:baseline;gap:8px">
          <span class="hs-text-foil" style="font-family:Michroma,sans-serif;font-size:96px;line-height:1.05;letter-spacing:-.04em">{{bpm}}</span>
          <span style="font-family:Michroma,sans-serif;font-size:13px;color:#8d93a0">BPM</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;margin-top:6px">
          <sc-for list="{{ticks}}" as="t" hint-placeholder-count="16">
            <span style="{{t.style}}"></span>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:6px">
      <sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
        <button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <div style="--r:2deg;transform:rotate(2deg);padding:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.12);clip-path:polygon(0 0,100% 0,100% 100%,12px 100%,0 calc(100% - 12px));animation:hs-drift 7s ease-in-out infinite">
        <div style="font-size:9px;letter-spacing:.3em;color:#8d93a0">DELAY 1/8 ·</div>
        <div style="font-family:Michroma,sans-serif;font-size:22px;margin-top:6px">{{e}}<span style="font-size:10px;color:#8d93a0"> MS</span></div>
      </div>
      <div style="--r:-2deg;transform:rotate(-2deg) translateY(10px);padding:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.12);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);animation:hs-drift 8s ease-in-out infinite">
        <div style="font-size:9px;letter-spacing:.3em;color:#8d93a0">DELAY 1/4</div>
        <div style="font-family:Michroma,sans-serif;font-size:22px;margin-top:6px">{{q}}<span style="font-size:10px;color:#8d93a0"> MS</span></div>
      </div>
    </div>

    <div style="position:relative;margin-top:8px;padding:14px 16px;border:1px solid rgba(255,255,255,0.12);display:flex;justify-content:space-between;align-items:center;overflow:hidden">
      <div class="hs-foil" style="position:absolute;left:0;top:0;bottom:0;width:4px;animation:hs-foil 3s linear infinite"></div>
      <div><div style="font-size:9px;letter-spacing:.3em;color:#8d93a0">REVERB DECAY · 1 BAR</div><div style="font-family:Michroma,sans-serif;font-size:20px;margin-top:6px">{{rv}}<span style="font-size:10px;color:#8d93a0"> MS</span></div></div>
      <div style="font-size:10px;letter-spacing:.2em;color:#8d93a0;text-align:right">PRE-DELAY<br><span style="color:#e9ebf0;font-size:14px">{{pd}} MS</span></div>
    </div>
  </div>

  <nav aria-label="Outils" style="position:absolute;left:0;right:0;bottom:0;height:92px;padding:12px 16px 26px;background:linear-gradient(transparent,#060608 30%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">
    <a href="#" class="hs-foil" style="display:grid;place-items:center;text-decoration:none;color:#060608;font-family:Michroma,sans-serif;font-size:9px;letter-spacing:.1em;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)">TEMPO</a>
    <a href="#" style="display:grid;place-items:center;text-decoration:none;color:#c9ccd4;font-family:Michroma,sans-serif;font-size:9px;letter-spacing:.1em;background:rgba(255,255,255,0.05);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)">TAP</a>
    <a href="#" style="display:grid;place-items:center;text-decoration:none;color:#c9ccd4;font-family:Michroma,sans-serif;font-size:9px;letter-spacing:.1em;background:rgba(255,255,255,0.05);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)">GAMMES</a>
    <a href="#" style="display:grid;place-items:center;text-decoration:none;color:#c9ccd4;font-family:Michroma,sans-serif;font-size:9px;letter-spacing:.1em;background:rgba(255,255,255,0.05);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)">SPLITS</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { bpm: 140 }; }
  renderVals() {
    var bpm = this.state.bpm, beat = 60000 / bpm, self = this;
    var f = function (x) { return x.toFixed(1).replace('.', ','); };
    var dur = (beat * 2 / 1000).toFixed(3) + 's';
    var ticks = [];
    for (var i = 0; i < 16; i++) {
      ticks.push({ style: 'display:block;height:' + (i % 4 === 0 ? 14 : 8) + 'px;transform-origin:left;' +
        (i % 4 === 0 ? 'background:linear-gradient(90deg,#c7c9ff,#ffd1f0,#c9fff1);' : 'background:rgba(255,255,255,0.25);') +
        'animation:hs-tick ' + dur + ' ease-in-out infinite;animation-delay:' + (i * 0.04).toFixed(2) + 's' });
    }
    var presets = [70, 90, 120, 140, 160].map(function (b) {
      var on = b === bpm;
      return { label: String(b), pick: function () { self.setState({ bpm: b }); },
        style: 'flex:1;height:44px;font-family:Chakra Petch,sans-serif;font-weight:700;font-size:14px;cursor:pointer;border:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);' +
          (on ? 'color:#060608;background:linear-gradient(170deg,#ffffff,#b8bcc6 40%,#ffffff 55%,#9ea3ad)' : 'color:#c9ccd4;background:rgba(255,255,255,0.07)') };
    });
    return { bpm: String(bpm), ticks: ticks, presets: presets, q: f(beat), e: f(beat * 0.75), rv: f(beat * 4 - beat / 8), pd: f(beat / 8) };
  }
}
</script>
</body>
</html>
