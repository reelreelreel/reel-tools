<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Piste D · Sceau &amp; Métal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=Pirata+One&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes se-coin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
@keyframes se-spec{0%{background-position:-160% 0}60%,100%{background-position:260% 0}}
@keyframes se-glow{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes se-stamp{0%,100%{transform:scale(1) rotate(-8deg)}8%{transform:scale(.86) rotate(-8deg)}16%{transform:scale(1.04) rotate(-8deg)}24%{transform:scale(1) rotate(-8deg)}}
@keyframes se-chain{0%,100%{transform:translateY(0) rotate(18deg)}50%{transform:translateY(10px) rotate(14deg)}}
.se-metal{background:repeating-linear-gradient(90deg,rgba(255,255,255,0.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,0.08) 0 2px,transparent 2px 7px),linear-gradient(160deg,#c9ccd2 0%,#8e9299 35%,#b9bcc3 55%,#6f737a 80%,#a7aab1 100%)}
.se-spec{position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,0.55) 48%,transparent 66%);background-size:60% 100%;background-repeat:no-repeat;animation:se-spec 5s ease-in-out infinite;mix-blend-mode:overlay;pointer-events:none}
.se-deboss{color:#4a4d53;text-shadow:0 1px 0 rgba(255,255,255,0.55),0 -1px 1px rgba(0,0,0,0.55)}
.se-emboss-dark{color:#d9dbe0;text-shadow:0 -1px 0 rgba(0,0,0,0.9),0 1px 0 rgba(255,255,255,0.15)}
.se-wax{background:radial-gradient(circle at 35% 30%,#e0574a 0%,#a3231b 45%,#5e0d09 100%);box-shadow:inset -4px -6px 10px rgba(0,0,0,0.45),inset 4px 4px 8px rgba(255,160,140,0.35),0 8px 18px rgba(0,0,0,0.6)}
@media (prefers-reduced-motion: reduce){[style*="animation"],.se-spec{animation:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:radial-gradient(80% 50% at 50% 0%,#1c1d20 0%,#070708 70%);color:#e9ebf0;font-family:'IBM Plex Mono',monospace">

  <svg width="150" height="150" viewBox="0 0 120 120" aria-hidden="true" style="position:absolute;right:-30px;top:120px;opacity:.5;animation:se-chain 7s ease-in-out infinite">
    <defs><linearGradient id="seG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".5" stop-color="#9fb4c8" stop-opacity=".25"/><stop offset="1" stop-color="#ffffff" stop-opacity=".8"/></linearGradient></defs>
    <rect x="20" y="10" width="40" height="70" rx="20" fill="none" stroke="url(#seG)" stroke-width="9"/>
    <rect x="50" y="50" width="40" height="70" rx="20" fill="none" stroke="url(#seG)" stroke-width="9"/>
  </svg>

  <div style="position:relative;display:flex;flex-direction:column;gap:18px;padding:54px 20px 0">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:64px;height:64px;perspective:400px">
        <div style="width:64px;height:64px;animation:se-coin 9s linear infinite;transform-style:preserve-3d">
          <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <radialGradient id="seC" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".45" stop-color="#a5a9b0"/><stop offset=".8" stop-color="#5c6067"/><stop offset="1" stop-color="#2e3035"/></radialGradient>
              <path id="seRing" d="M50 50 m-36 0 a36 36 0 1 1 72 0 a36 36 0 1 1 -72 0"/>
            </defs>
            <circle cx="50" cy="50" r="48" fill="url(#seC)"/>
            <circle cx="50" cy="50" r="45" fill="none" stroke="#3a3d42" stroke-width="1.2"/>
            <circle cx="50" cy="50" r="29" fill="none" stroke="#3a3d42" stroke-width="1"/>
            <text font-family="Cinzel" font-weight="700" font-size="8.5" fill="#33363b" letter-spacing="2.2"><textPath href="#seRing">REEL'S TOOLS · STUDIO · MMXXVI ·</textPath></text>
            <text x="50" y="61" text-anchor="middle" font-family="Pirata One" font-size="34" fill="#2b2d31" stroke="#eef0f3" stroke-width=".6">RT</text>
          </svg>
        </div>
      </div>
      <div>
        <div style="font-family:Cinzel,serif;font-weight:900;font-size:22px;letter-spacing:.14em;line-height:1;background:linear-gradient(180deg,#ffffff,#9ea3ab 55%,#e6e8ec);-webkit-background-clip:text;background-clip:text;color:transparent">REEL'S TOOLS</div>
        <div style="font-size:9px;letter-spacing:.38em;color:#7d828b;margin-top:6px">ÉDITION Nº 001 · RARITY</div>
      </div>
    </div>

    <div class="se-metal" style="position:relative;border-radius:22px;padding:18px 20px 16px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -2px 6px rgba(0,0,0,0.35),0 24px 50px rgba(0,0,0,0.7)">
      <div class="se-spec"></div>
      <div style="position:relative;display:flex;justify-content:space-between;align-items:center">
        <span class="se-deboss" style="font-family:Cinzel,serif;font-weight:700;font-size:11px;letter-spacing:.3em">TEMPO</span>
        <span class="se-deboss" style="font-size:10px;letter-spacing:.2em">BPM</span>
      </div>
      <div class="se-deboss" style="position:relative;font-family:Cinzel,serif;font-weight:900;font-size:118px;line-height:1;letter-spacing:-.02em;margin-top:2px">{{bpm}}</div>
      <div style="position:relative;display:flex;gap:6px;margin-top:6px">
        <sc-for list="{{beats}}" as="b" hint-placeholder-count="4">
          <span style="{{b.style}}"></span>
        </sc-for>
      </div>
      <div style="position:absolute;right:14px;bottom:12px;width:58px;height:58px;border-radius:50%;animation:se-stamp {{beatS}} ease-out infinite" class="se-wax">
        <svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><text x="29" y="38" text-anchor="middle" font-family="Pirata One" font-size="26" fill="#5e0d09" opacity=".75">R</text><circle cx="29" cy="29" r="20" fill="none" stroke="#5e0d09" stroke-opacity=".5" stroke-width="1.5"/></svg>
      </div>
    </div>

    <div style="display:flex;gap:8px">
      <sc-for list="{{presets}}" as="p" hint-placeholder-count="5">
        <button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="3">
        <div style="position:relative;border-radius:16px;padding:12px;background:linear-gradient(160deg,rgba(255,255,255,0.09),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.14);box-shadow:inset 0 1px 0 rgba(255,255,255,0.18);backdrop-filter:blur(6px)">
          <div style="font-family:Cinzel,serif;font-size:10px;letter-spacing:.2em;color:#8a8f98">{{c.k}}</div>
          <div class="se-emboss-dark" style="font-weight:600;font-size:18px;margin-top:6px">{{c.v}}</div>
          <div style="font-size:9px;color:#7d828b">ms</div>
        </div>
      </sc-for>
    </div>

    <div style="position:relative;border-radius:18px;padding:14px 16px;border:1px solid rgba(255,255,255,0.1);background:#0d0d0f;display:flex;align-items:center;gap:14px;overflow:hidden">
      <div style="position:absolute;inset:0;background:radial-gradient(60% 120% at 0% 50%,rgba(163,35,27,0.25),transparent 70%);animation:se-glow 3s ease-in-out infinite"></div>
      <div class="se-wax" style="position:relative;width:12px;height:12px;border-radius:50%"></div>
      <div style="position:relative;flex:1">
        <div style="font-family:Cinzel,serif;font-size:10px;letter-spacing:.24em;color:#8a8f98">REVERB · DECAY 1 MESURE</div>
        <div class="se-emboss-dark" style="font-weight:600;font-size:20px;margin-top:4px">{{rv}} <span style="font-size:10px;color:#7d828b">ms</span></div>
      </div>
      <div style="position:relative;font-size:10px;color:#8a8f98;text-align:right">PRE-DELAY<br><span style="color:#e9ebf0;font-size:13px">{{pd}}</span></div>
    </div>
  </div>

  <nav aria-label="Outils" class="se-metal" style="position:absolute;left:14px;right:14px;bottom:22px;height:66px;border-radius:20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 16px 30px rgba(0,0,0,0.7)">
    <a href="#" style="position:relative;display:grid;place-items:center;height:100%;text-decoration:none;font-family:Cinzel,serif;font-weight:700;font-size:10px;letter-spacing:.16em;color:#f3e2df;text-shadow:0 -1px 0 rgba(0,0,0,0.6)"><span class="se-wax" style="position:absolute;width:62px;height:40px;border-radius:20px;z-index:0"></span><span style="position:relative">TEMPO</span></a>
    <a href="#" class="se-deboss" style="display:grid;place-items:center;height:100%;text-decoration:none;font-family:Cinzel,serif;font-weight:700;font-size:10px;letter-spacing:.16em">TAP</a>
    <a href="#" class="se-deboss" style="display:grid;place-items:center;height:100%;text-decoration:none;font-family:Cinzel,serif;font-weight:700;font-size:10px;letter-spacing:.16em">GAMMES</a>
    <a href="#" class="se-deboss" style="display:grid;place-items:center;height:100%;text-decoration:none;font-family:Cinzel,serif;font-weight:700;font-size:10px;letter-spacing:.16em">SPLITS</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { bpm: 140, beat: 0 }; }
  componentDidMount(){ this.tick(); }
  componentWillUnmount(){ clearTimeout(this.t); }
  tick(){ var self = this; this.t = setTimeout(function(){ self.setState({ beat: (self.state.beat + 1) % 4 }); self.tick(); }, 60000 / this.state.bpm); }
  renderVals() {
    var bpm = this.state.bpm, beat = 60000 / bpm, self = this, cur = this.state.beat;
    var f = function (x) { return x.toFixed(1).replace('.', ','); };
    var beats = [0,1,2,3].map(function (i) {
      var on = i === cur;
      return { style: 'display:block;width:14px;height:14px;border-radius:50%;' + (on
        ? 'background:radial-gradient(circle at 35% 30%,#e0574a,#a3231b 50%,#5e0d09);box-shadow:0 0 10px rgba(224,87,74,0.7)'
        : 'background:#7d8188;box-shadow:inset 0 1px 2px rgba(0,0,0,0.6),0 1px 0 rgba(255,255,255,0.5)') };
    });
    var presets = [70, 90, 120, 140, 160].map(function (b) {
      var on = b === bpm;
      return { label: String(b), pick: function () { self.setState({ bpm: b }); },
        style: 'flex:1;height:46px;border-radius:23px;font-family:IBM Plex Mono,monospace;font-weight:600;font-size:13px;cursor:pointer;' +
          (on ? 'color:#f3e2df;border:0;background:radial-gradient(circle at 35% 30%,#e0574a,#a3231b 50%,#5e0d09);box-shadow:inset -2px -3px 6px rgba(0,0,0,0.45),0 6px 14px rgba(0,0,0,0.6)'
              : 'color:#2b2d31;border:0;background:linear-gradient(160deg,#c9ccd2,#8e9299 50%,#b9bcc3);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 4px 10px rgba(0,0,0,0.5)') };
    });
    return { bpm: String(bpm), beats: beats, beatS: (beat / 1000).toFixed(3) + 's', presets: presets,
      cells: [{ k: '1/4', v: f(beat) }, { k: '1/8 ·', v: f(beat * 0.75) }, { k: '1/16 T', v: f(beat / 6) }],
      rv: f(beat * 4 - beat / 8), pd: f(beat / 8) };
  }
}
</script>
</body>
</html>
