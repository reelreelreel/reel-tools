// ---------------- state ----------------

// ---------------- helpers ----------------
function rnd(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function ctex(c, srgb) { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const U = 0.04445, RW = 0.483, RINNER = 0.450;
const clickables = [];
function tag(obj, action) { obj.traverse((o) => { if (o.isMesh) { o.userData.action = action; clickables.push(o); } }); }
function shadow(obj) { obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return obj; }

}

// faceplate factory
function faceplate(units, opts) {
  const h = units * U - 0.0008;
  const W = 2048, H = Math.round(2048 * h / RW);
  const [c, x] = cv(W, H);
  const P = (m) => m / RW * W; // meters to px
  x.fillStyle = opts.base; x.fillRect(0, 0, W, H);
  brushed(x, W, H, opts.seed, opts.brush ?? .05);
  grime(x, W, H, opts.seed + 3, opts.grime ?? 1);
  // ear slots
  x.fillStyle = "rgba(0,0,0,.85)";
  const slotY = units === 1 ? [H / 2] : [P(0.0127 + 0.0032), H - P(0.0127 + 0.0032)];
  for (const sxm of [0.008, RW - 0.008]) for (const sy of slotY) { const w = P(0.010), hh = P(0.0065); x.beginPath(); x.roundRect(P(sxm) - w / 2, sy - hh / 2, w, hh, hh / 2); x.fill(); }
  opts.draw?.(x, P, W, H);
  const tex = ctex(c, true);
  const mat = new THREE.MeshPhysicalMaterial({ map: tex, metalness: opts.metal ?? 0.9, roughness: opts.rough ?? 0.42, normalMap: scratchN, normalScale: new THREE.Vector2(0.06, 0.06), clearcoat: opts.clear ?? 0 });
  const g = new THREE.Group();
  const plate = new THREE.Mesh(new RoundedBoxGeometry(RW, h, 0.003, 2, 0.0008), mat);
  plate.position.z = 0.0015; g.add(plate);
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(RINNER - 0.01, h - 0.004, 0.24), new THREE.MeshStandardMaterial({ color: 0x0b0b0b, roughness: 0.6, metalness: 0.5 }));
  chassis.position.z = -0.12; g.add(chassis);
  for (const sxm of [-RW / 2 + 0.008, RW / 2 - 0.008]) for (const sy of slotY) { const s = screw(); s.position.set(sxm, h / 2 - sy / H * h, 0.0035); g.add(s); }
  g.userData.h = h; g.userData.canvas = c; g.userData.ctx = x; g.userData.tex = tex;
  return g;
}
function silk(x, txt, px, py, size, color = "rgba(236,232,224,.9)", align = "left", font = "700", fam = "'Archivo Narrow'") { x.fillStyle = color; x.font = `${font} ${size}px ${fam}`; x.textAlign = align; x.textBaseline = "middle"; x.fillText(txt, px, py); x.textAlign = "left"; }

  if (e.key === "Escape") go("overview");
  if (e.key === "PageDown") go(order[Math.min(order.length - 1, i + 1)]);
  if (e.key === "PageUp") go(order[Math.max(0, i - 1)]);
  if (current !== "tempo") return;
  if (e.code === "Space") { e.preventDefault(); tap(); }
  if (e.key === "ArrowUp" || e.key === "ArrowRight") setBpm(bpm + (e.shiftKey ? 0.1 : 1));
  if (e.key === "ArrowDown" || e.key === "ArrowLeft") setBpm(bpm - (e.shiftKey ? 0.1 : 1));
  if (e.key === "n") setNote(noteIx + 1);
});

drawLed(); drawVfd();
$("boot").classList.add("off");
setTimeout(hideHint, 7000);

// ---------------- loop ----------------
const clock = new THREE.Clock(); let lastBeat = -1;
const tmpV = new THREE.Vector3();
function frame() {
  const t = clock.getElapsedTime(), dt = Math.min(clock.getDelta(), 0.05);
  // camera
  const target = shotPose(current, camera.aspect);
  const k = reduced ? 1 : 0.06;
  cam.pos.lerp(target.pos, k); cam.look.lerp(target.look, k);
  par.x += (pointer.x - par.x) * 0.05; par.y += (pointer.y - par.y) * 0.05;
  const amp = focused() ? 0.02 : 0.06, drift = reduced ? 0 : 1;
  camera.position.copy(cam.pos).add(tmpV.set(par.x * amp + Math.sin(t * 0.31) * 0.004 * drift, -par.y * amp * 0.6 + Math.sin(t * 0.23) * 0.003 * drift, 0));
  camera.lookAt(cam.look);
  bokeh.uniforms.focus.value = camera.position.distanceTo(cam.look);
  bokeh.uniforms.aperture.value = focused() ? 0.02 : 0.009;
  // tempo hardware
  const beatLen = 60 / bpm, b = Math.floor(t / beatLen), ph = (t % beatLen) / beatLen;
  if (b !== lastBeat) lastBeat = b;
  const pulse = reduced ? 0.4 : Math.exp(-ph * 8);
  jewel.material.emissiveIntensity = 0.15 + pulse * 5;
  tapLed.material.emissiveIntensity = 0.15 + flash * 6 + pulse * 0.4;
  ledSpill.intensity = 0.0;
  enc.userData.spin.rotation.y += ((-(bpm - 30) / 270 * Math.PI * 1.66) - enc.userData.spin.rotation.y) * 0.25;
  selector.rotation.y += ((-(-150 + noteIx * (300 / (NOTES.length - 1))) * Math.PI / 180) - selector.rotation.y) * 0.3;
  tapPress *= 0.8; flash *= 0.86; tapBtn.position.z = 0.005 - tapPress * 0.003;
  if (flash > 0.04) drawLed(flash > 0.5);
  if (vfdMsg && performance.now() > vfdMsgT) { vfdMsg = null; drawVfd(); }
  // decor units: spectrum + VU dance on the beat
  if (!reduced) {
    bars.forEach((col, i) => { const lvl = Math.max(0, Math.min(5, Math.round((Math.sin(t * (1.3 + i * 0.37)) * 0.5 + 0.5) * 3 + pulse * 2 - i * 0.06))); col.forEach((m, k2) => { m.material = k2 < lvl ? barMatOn[k2] : barMatOff; }); });
    vuNeedles.forEach((n, i) => { const tgt = -0.62 + pulse * 0.75 + Math.sin(t * (2 + i)) * 0.06; n.rotation.z += (-tgt - n.rotation.z) * 0.2; });
  }
  composer.render();
  requestAnimationFrame(frame);
}
frame();
</script>
